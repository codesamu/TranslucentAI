<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translucent AI</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <input type="password" id="apiKey" placeholder="OpenRouter API Key" class="compact-input" />
    <button id="analyzeBtn" class="compact-btn">Analyze</button>
    <div id="resultContainer" class="compact-result hidden">
      <label>Answer</label>
      <div id="output" class="output-text"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
